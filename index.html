<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Galaxy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>SUPER MARIO GALAXY</h1>
        <div class="info-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="coins">Star Bits: <span id="coins">0</span></div>
            <div class="lives">Lives: <span id="lives">3</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <p><strong>Controls:</strong> Arrow Keys / WASD to Move | Space / W / Up to Jump | Z / X / Shift to Spin</p>
            <button id="restartBtn">Restart Galaxy</button>
        </div>
        <div id="gameOver" class="game-over hidden">
            <h2>Game Over</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button id="restartFromGameOver">Try Again</button>
        </div>
        <div id="levelComplete" class="level-complete hidden">
            <h2>Star Get!</h2>
            <p>Final Score: <span id="completeScore">0</span></p>
            <button id="restartFromComplete">Play Again</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
